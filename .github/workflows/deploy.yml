# Theo docs/deployment-standard.md của mika-cms-webapp (máy Lightsail dùng chung).

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # These labels are what makes the scoped prune below safe. Do not drop them.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Secrets, not variables: Actions logs of a public repo are world-readable,
          # and only secrets are masked there.
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Thiếu khoá thì dừng deploy ở đây, trước khi đụng container đang
            # chạy - chứ không lặng lẽ chạy bản không có Vertex. Chủ ý chạy bản
            # mô phỏng thì bỏ hẳn các dòng Vertex trong docker run.
            VERTEX_KEY=/home/ubuntu/tu-lanh-ra-mon/gcp-key.json
            test -f "$VERTEX_KEY"

            docker stop tu-lanh-ra-mon || true
            docker rm tu-lanh-ra-mon || true

            # 127.0.0.1 only — Docker's port rules bypass the host firewall, so
            # publishing on all interfaces would serve this app over plain HTTP.
            # The caps keep one app from starving its neighbours on a shared box.
            docker run -d \
              --name tu-lanh-ra-mon \
              --restart unless-stopped \
              -p 127.0.0.1:3001:3000 \
              --memory=512m --memory-swap=512m \
              --cpus=0.5 \
              --log-opt max-size=10m --log-opt max-file=3 \
              -e NODE_OPTIONS=--max-old-space-size=384 \
              -v "$VERTEX_KEY":/secrets/gcp-sa.json:ro \
              -e GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-sa.json \
              -e GOOGLE_CLOUD_PROJECT=${{ vars.GOOGLE_CLOUD_PROJECT }} \
              -e GOOGLE_CLOUD_LOCATION=${{ vars.GOOGLE_CLOUD_LOCATION }} \
              -e GEMINI_MODEL=${{ vars.GEMINI_MODEL }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

            # A crash-looping container must fail the deploy, not ship green.
            # `if ... fi` rather than `[ ... ] && break`: a false && as the last
            # command of the loop body trips set -e on the first iteration.
            STATUS=starting
            for i in $(seq 1 30); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' tu-lanh-ra-mon)
              if [ "$STATUS" = healthy ]; then break; fi
              sleep 3
            done
            if [ "$STATUS" != healthy ]; then
              docker logs --tail 50 tu-lanh-ra-mon
              exit 1
            fi

            # Prune only THIS project's old images. An unscoped `prune -af` would
            # delete other projects' rollback targets from the shared host.
            docker image prune -af \
              --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
